[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-forge"
version = "0.1.0"
description = "HSV-based product color variants. Batch-generate catalog images from one photo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
keywords = ["image-processing", "pillow", "product-photography", "e-commerce", "color"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pixel-forge = "pixel_forge.cli:main"

[tool.setuptools.packages.find]
include = ["pixel_forge*"]
